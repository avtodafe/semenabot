name: Run roseltorg now

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy latest code and run roseltorg parser
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        with:
          host: 46.8.254.134
          port: 2244
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 8m
          envs: GH_PAT
          script: |
            set -x
            cd /root/semenabot
            git remote set-url origin https://$GH_PAT@github.com/avtodafe/semenabot.git
            git fetch origin claude/seed-parser-bot-qO5Mo
            git reset --hard origin/claude/seed-parser-bot-qO5Mo
            echo "=== Python version ==="
            python3 --version
            echo "=== .env exists ==="
            ls -la .env || echo "NO .env FILE"
            echo "=== Running script ==="
            python3 run_roseltorg_now.py 2>&1 | tee /tmp/roseltorg_run.txt || echo "SCRIPT EXITED WITH ERROR"
            echo "=== Last 50 lines of parse.log ==="
            tail -50 parse.log 2>/dev/null || echo "NO parse.log"
            cp /tmp/roseltorg_run.txt roseltorg_run_output.txt
            git config user.email "bot@semenabot"
            git config user.name "SemenaBot"
            git add roseltorg_run_output.txt parse.log 2>/dev/null || true
            git commit -m "auto: roseltorg run output $(date '+%Y-%m-%d %H:%M')" || true
            git push origin claude/seed-parser-bot-qO5Mo || true
