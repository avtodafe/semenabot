name: Run roseltorg now

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy and run roseltorg parser
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        with:
          host: 46.8.254.134
          port: 2244
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 8m
          envs: GH_PAT
          script: |
            set +e
            cd /root/semenabot

            # Clear stale git locks left by concurrent workflows
            rm -f .git/index.lock .git/HEAD.lock

            git remote set-url origin "https://$GH_PAT@github.com/avtodafe/semenabot.git"
            git fetch origin claude/seed-parser-bot-qO5Mo 2>&1 | head -5
            git reset --hard origin/claude/seed-parser-bot-qO5Mo 2>&1 | head -5

            # Run script and capture output
            python3 run_roseltorg_now.py > /tmp/run_out.txt 2>&1
            EXIT_CODE=$?
            echo "Exit code: $EXIT_CODE"
            cat /tmp/run_out.txt

            # Upload output to GitHub via API using Python (proper JSON, no shell quoting issues)
            GH_PAT="$GH_PAT" python3 - <<'PYEOF'
import base64, json, os, subprocess
from datetime import datetime

with open('/tmp/run_out.txt', 'rb') as f:
    content = base64.b64encode(f.read()).decode()

token = os.environ['GH_PAT']
api = 'https://api.github.com/repos/avtodafe/semenabot/contents/roseltorg_run_output.txt'
branch = 'claude/seed-parser-bot-qO5Mo'

r = subprocess.run(['curl', '-sf', '-H', f'Authorization: token {token}',
    f'{api}?ref={branch}'], capture_output=True, text=True)
try:
    sha = json.loads(r.stdout).get('sha', '')
except Exception:
    sha = ''

body = {'message': f'auto: roseltorg run {datetime.now().strftime("%Y-%m-%d %H:%M")}',
        'content': content, 'branch': branch}
if sha:
    body['sha'] = sha

r = subprocess.run(['curl', '-s', '-X', 'PUT',
    '-H', f'Authorization: token {token}',
    '-H', 'Content-Type: application/json',
    api, '-d', json.dumps(body)], capture_output=True, text=True)
try:
    d = json.loads(r.stdout)
    print('Upload:', d.get('commit', {}).get('sha', 'ERR-no-commit')[:12])
    if 'message' in d and 'commit' not in d:
        print('API error:', d['message'])
except Exception as e:
    print('Parse error:', e, '| Response:', r.stdout[:300])
PYEOF
