name: Run roseltorg now

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy and run roseltorg parser
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        with:
          host: 46.8.254.134
          port: 2244
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 8m
          envs: GH_PAT
          script: |
            set +e
            cd /root/semenabot

            # Clear stale git locks left by concurrent workflows
            rm -f .git/index.lock .git/HEAD.lock .git/refs/heads/claude/seed-parser-bot-qO5Mo.lock

            git remote set-url origin "https://$GH_PAT@github.com/avtodafe/semenabot.git"
            git fetch origin claude/seed-parser-bot-qO5Mo 2>&1 | head -5
            git reset --hard origin/claude/seed-parser-bot-qO5Mo 2>&1 | head -5

            # Run script and capture output
            python3 run_roseltorg_now.py > /tmp/run_out.txt 2>&1
            EXIT_CODE=$?
            echo "Exit code: $EXIT_CODE"
            cat /tmp/run_out.txt

            # Upload output to GitHub via API (avoids git conflicts)
            CONTENT=$(base64 -w 0 /tmp/run_out.txt)
            SHA=$(curl -s -H "Authorization: token $GH_PAT" \
              "https://api.github.com/repos/avtodafe/semenabot/contents/roseltorg_run_output.txt?ref=claude/seed-parser-bot-qO5Mo" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")
            if [ -n "$SHA" ]; then
              BODY="{\"message\":\"auto: roseltorg run $(date '+%Y-%m-%d %H:%M')\",\"content\":\"$CONTENT\",\"sha\":\"$SHA\",\"branch\":\"claude/seed-parser-bot-qO5Mo\"}"
            else
              BODY="{\"message\":\"auto: roseltorg run $(date '+%Y-%m-%d %H:%M')\",\"content\":\"$CONTENT\",\"branch\":\"claude/seed-parser-bot-qO5Mo\"}"
            fi
            curl -s -X PUT \
              -H "Authorization: token $GH_PAT" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/avtodafe/semenabot/contents/roseltorg_run_output.txt" \
              -d "$BODY" | python3 -c "import json,sys; d=json.load(sys.stdin); print('Upload:', d.get('commit',{}).get('sha','ERR')[:12])" || echo "Upload failed"
