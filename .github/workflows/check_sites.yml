name: Check sites availability

on:
  workflow_dispatch:
  push:
    branches:
      - claude/seed-parser-bot-qO5Mo
    paths:
      - 'check_roseltorg.py'
      - 'check_sites.py'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deploy latest code via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 46.8.254.134
          port: 2244
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 4m
          script: |
            cd /root/semenabot
            git fetch origin claude/seed-parser-bot-qO5Mo
            git reset --hard origin/claude/seed-parser-bot-qO5Mo
            python3 check_roseltorg.py
