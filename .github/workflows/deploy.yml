name: Deploy to VPS

on:
  push:
    branches:
      - claude/seed-parser-bot-qO5Mo

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 46.8.254.134
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/semenabot
            git pull origin claude/seed-parser-bot-qO5Mo
            echo "Deploy complete"
